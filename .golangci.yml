# golangci-lint configuration. Run: make lint  (or: golangci-lint run)
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - asasalint
    - bodyclose
    - copyloopvar
    - dupl
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gofumpt
    - goimports
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

linters-settings:
  gocyclo:
    min-complexity: 20
  goimports:
    local-prefixes: github.com/cjunius/goChess
  govet:
    enable-all: true
    disable:
      - fieldalignment
  revive:
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers"]
  dupl:
    threshold: 150

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files: allow table-driven duplication and skip some strictness.
    - path: _test\.go
      linters:
        - dupl
        - gocyclo
        - gosec
        - unparam
