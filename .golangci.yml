# golangci-lint configuration (v2 schema). Run: make lint  (or: golangci-lint run)
version: "2"
run:
  tests: true
linters:
  enable:
    - asasalint
    - bodyclose
    - copyloopvar
    - dupl
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 150
    gocyclo:
      min-complexity: 20
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - gocyclo
          - gosec
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cjunius/goChess
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
