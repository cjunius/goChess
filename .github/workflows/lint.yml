name: Lint

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.61.0

  gofumpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Check formatting
        run: |
          go install mvdan.cc/gofumpt@latest
          fmt_out="$(gofumpt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "These files are not gofumpt-formatted:"
            echo "$fmt_out"
            exit 1
          fi
