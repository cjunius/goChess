name: Bug report
description: A crash, an illegal move, a wrong result, or other incorrect behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, do **not** file here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: fen
    attributes:
      label: Position (FEN)
      placeholder: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact UCI commands or CLI invocation.
      placeholder: |
        position fen <fen>
        go movetime 1000
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gochess version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      render: shell
